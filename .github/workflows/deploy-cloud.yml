name: TrummPlaner Cloud PWA
on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trummplaner-cloud-pages-v160
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: App-Code pruefen
        run: |
          node --check cloud/public/app.js
          node --check cloud/public/extended.js
          node --check cloud/public/dictation.js
          node --check cloud/public/due-presets.js
          node --check cloud/public/sw.js
          node -e "JSON.parse(require('fs').readFileSync('cloud/public/manifest.webmanifest','utf8'))"
      - name: Word-Dokumente und Formatierungen testen
        run: |
          npm install --prefix cloud --no-save --no-package-lock --no-audit --no-fund docx@9.15.3 jsdom@26.1.0 jszip@3.10.1
          node cloud/tests/editor-smoke.mjs
          node cloud/tests/table-editor-smoke.mjs
          node cloud/tests/dictation-smoke.mjs
          node cloud/tests/project-tasks-smoke.mjs
          node cloud/tests/task-project-selector-smoke.mjs
          node cloud/tests/project-delete-smoke.mjs
          node cloud/tests/due-presets-smoke.mjs
          node cloud/tests/vice-city-theme-smoke.mjs
      - name: Smartphone-Icons aus dem Original-Logo erstellen
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder=Path('cloud/public/icons')
          logo=Image.open(folder/'logo-full.webp').convert('RGB')
          icon=logo.crop((68,35,190,159))
          for size in (192,512):
              icon.resize((size,size),Image.Resampling.LANCZOS).save(folder/f'icon-{size}.png',format='PNG')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./cloud/public
      - name: Auf GitHub Pages Artefakt-Registrierung warten
        run: sleep 12
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
