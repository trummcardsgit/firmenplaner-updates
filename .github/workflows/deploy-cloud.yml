name: RHTFLOW 2.0 Production PWA
on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trummplaner-cloud-pages-v160
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trummcardsgit/rhtflow-test
          ref: 4f0f45bfb8d79c5bc923548585f22e69976f2847
          path: branding-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test application before production build
        run: |
          for f in cloud/public/*.js; do node --check "$f"; done
          node cloud/tests/tickets-smoke.mjs
          node cloud/tests/pwa-isolation-smoke.mjs
          node cloud/tests/recovery-smoke.mjs
          npm install --prefix cloud --no-save --no-package-lock --no-audit --no-fund docx@9.15.3 jsdom@26.1.0 jszip@3.10.1
          for f in cloud/tests/*-smoke.mjs; do node "$f"; done
      - name: Prepare full-resolution production branding
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 cloud/prepare-production-branding.py
          node cloud/prepare-vendor.mjs cloud/public
          node cloud/verify-production-build.mjs
          for f in cloud/public/*.js; do node --check "$f"; done
          touch cloud/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production only
        id: deployment
        uses: actions/deploy-pages@v4
