name: FirmenPlaner Update veroeffentlichen
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neue Version (z.B. 1.2.0, ohne v)'
        required: true
        type: string
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: firmenplaner-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version vorbereiten
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            node scripts/bump-version.js "$VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            node -e 'if(process.argv[1]!==require("./package.json").version)process.exit(1)' "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: npm test
      - name: Release-Dateien bauen
        run: npm run release:pack
      - name: Quellcode aktualisieren und taggen
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/index.html public/app.js public/sw.js
          if ! git diff --cached --quiet; then git commit -m "Release v$VERSION"; fi
          git push origin "HEAD:${{ github.ref_name }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: GitHub Release mit Update-Dateien
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/firmenplaner-update.zip dist/update.json --generate-notes --title "FirmenPlaner v$VERSION"
