name: Enterprise staging checks
on:
  push:
    branches: [enterprise-2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for f in cloud/public/*.js; do node --check "$f"; done
          node cloud/tests/tickets-smoke.mjs
      - run: |
          npm install --prefix cloud --no-save --no-package-lock --no-audit --no-fund docx@9.15.3 jsdom@26.1.0 jszip@3.10.1
          node cloud/tests/trophies-smoke.mjs
          node cloud/tests/game-progression-smoke.mjs
