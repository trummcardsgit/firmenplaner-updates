<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1117"><meta name="description" content="TrummPlaner Cloud – Aufgaben und Notizen für deine Firmen"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>TrummPlaner Cloud</title></head><body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<section id="auth" class="auth-wrap"><div class="auth-panel"><img src="./icons/logo-full.webp" alt="TrummPlaner" class="auth-logo"><h1>Dein Tag. Dein Überblick.</h1><p>Firmen, Notizen, Aufgaben und Erinnerungen – überall synchronisiert.</p><div id="setup-warning" class="warning hidden">Die Supabase-Verbindung wurde noch nicht eingerichtet. Siehe README.md.</div><form id="auth-form"><label>E-Mail<input type="email" id="login-email" autocomplete="username" required placeholder="name@beispiel.at"></label><label>Passwort<input type="password" id="login-password" autocomplete="current-password" required minlength="6" placeholder="Dein Passwort"></label><button class="primary" id="login-submit">Anmelden</button><button type="button" class="subtle" id="signup">Neues Konto erstellen</button></form><p class="small" id="auth-note">Einmal anmelden, danach mit PC und Smartphone arbeiten.</p></div></section>
<div id="app" class="app-shell hidden"><aside class="sidebar"><img src="./icons/logo-full.webp" alt="TrummPlaner" class="brand"><nav id="nav" aria-label="Hauptmenü"><button class="nav active" data-view="dashboard">◫ <span>Übersicht</span></button><button class="nav" data-view="tasks">☑ <span>Aufgaben</span></button><button class="nav" data-view="notes">▤ <span>Notizen</span></button><button class="nav" data-view="companies">▦ <span>Firmen</span></button><button class="nav" data-view="settings">⚙ <span>Einstellungen</span></button></nav><div class="side-bottom"><span id="user-label"></span><button id="signout" class="subtle">Abmelden</button></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">TRUMMPLANER CLOUD</div><h1 id="page-title">Übersicht</h1></div><button id="new-entry" class="primary">+ Neuer Eintrag</button></header><section id="content" aria-live="polite"></section></main><nav class="bottom-nav" aria-label="Mobile Navigation"><button data-view="dashboard" class="active">◫<span>Start</span></button><button data-view="tasks">☑<span>Aufgaben</span></button><button data-view="notes">▤<span>Notizen</span></button><button data-view="companies">▦<span>Firmen</span></button><button data-view="settings">⚙<span>Mehr</span></button></nav></div>
<dialog id="editor"><form id="entry-form"><div class="modal-header"><h2 id="entry-heading">Eintrag erstellen</h2><button type="button" class="close" data-close>×</button></div><input id="entry-id" type="hidden"><div class="fields"><label>Typ<select id="entry-kind"><option value="task">Aufgabe</option><option value="note">Notiz</option></select></label><label>Firma *<select id="entry-company" required></select></label><label class="wide">Titel *<input id="entry-title" required maxlength="180" placeholder="Was ist zu erledigen?"></label><label class="wide">Problembeschreibung / Notiz<textarea id="entry-description" rows="5" placeholder="Fehlerbild, Schritte, Informationen …"></textarea></label><label>Priorität<select id="entry-priority"><option value="normal">Normal</option><option value="high">Hoch</option><option value="low">Niedrig</option></select></label><label>Status<select id="entry-status"><option value="open">Offen</option><option value="done">Erledigt</option></select></label><label>Fällig am<input type="datetime-local" id="entry-due"></label><label>Erinnern am<input type="datetime-local" id="entry-remind"></label></div><div class="modal-actions"><button type="button" class="subtle" data-close>Abbrechen</button><button class="primary">Speichern</button></div></form></dialog>
<dialog id="company-editor"><form id="company-form"><div class="modal-header"><h2>Firma</h2><button type="button" class="close" data-close>×</button></div><input type="hidden" id="company-id"><label>Firmenname *<input id="company-name" required maxlength="160"></label><label>Ansprechpartner<input id="company-contact"></label><label>Telefon<input id="company-phone"></label><label>E-Mail<input type="email" id="company-email"></label><div class="modal-actions"><button type="button" class="subtle" data-close>Abbrechen</button><button class="primary">Speichern</button></div></form></dialog>
<script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
